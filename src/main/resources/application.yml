spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pgconnect}
    username: ${DB_USERNAME:pgconnect}
    password: ${DB_PASSWORD:pgconnect}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:8080/api/v1/payment/success}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:8080/api/v1/payment/cancel}
